services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kubeeye
      POSTGRES_PASSWORD: kubeeye
      POSTGRES_DB: kubeeye-db-test
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeeye -d kubeeye-db-test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend-lint:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/.prettierrc.json:/app/.prettierrc.json
      - ./frontend/.stylelintrc.json:/app/.stylelintrc.json
    profiles: ["test"]

  test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    ports:
      - "8001:8000"  # Port for test server if needed
    volumes:
      - ./backend/app:/app
      - ./backend/tests:/app/tests
    environment:
       - PYTHONPATH=/app
       - KUBEEYE_DATA_DIR=/app/data
       - KUBEEYE_REPORT_RETENTION_DAYS=0
       - KUBEEYE_SSH_CONNECTION_TIMEOUT=10
       - KUBEEYE_SSH_MAX_CONCURRENT_CHECKS=10
       - KUBEEYE_GITOPS_REPO_NAME=kubeeye_rules
       - KUBEEYE_GITOPS_REPO_URL=https://github.com/optical4eye/kubeeye-rules.git
       - KUBEEYE_GITOPS_REPO_BRANCH=main
       - KUBEEYE_GITOPS_REPO_USERNAME=optical4eye
       - KUBEEYE_GITOPS_REPO_TOKEN=""
       - KUBEEYE_GITOPS_REPO_DESCRIPTION=kubeeye repo rules
       - DB_HOST=postgres-test
       - DB_PORT=5432
       - DB_USER=kubeeye
       - DB_PASS=kubeeye
       - DB_NAME=kubeeye-db-test
    command: ["pytest", "/app/tests/", "-v", "--tb=short", "--cov=.", "--cov-report=term-missing"]
    depends_on:
      postgres-test:
        condition: service_healthy
    profiles: ["test"]

networks:
  default:
    name: kubeeye-test-network
