---
# OPA rule - host path mounting check (simplified version)
id: opa_host_path
name: Pod host path mounting check
description: Checks if Pod mounts host paths; each rule is a separate check
type: opa
category: security
severity: critical
enabled: true
tier: basic


# Rule configuration
config:
  # Resources configuration
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true


  # Rego rule configuration
  rego:
    inline: |
      package kubernetes

      # Get Pod specification
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }

      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }

      # Check host path mounting
      host_path_volumes(volumes) = host_paths if {
          host_paths := [volume |
              volume := volumes[_]
              volume.hostPath
          ]
      }

      # Define violations
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          volumes := default_array(spec.volumes)
          host_paths := host_path_volumes(volumes)
          count(host_paths) > 0

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' mounts %d host path volume(s): %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  count(host_paths),
                  concat(", ", [v.name | v := host_paths[_]])
              ])
          }
      }

      # Helper functions
      default_array(val) = result if {
          val != null
          result = val
      }

      default_array(val) = [] if {
          val == null
      }

  # Assertions configuration
  assertions:
    - name: "Host path mounting check"
      condition: "violation_count == 0"
      severity: critical
      description: "Found {{ violation_count }} host path mountings"


# Problem resolution recommendations
solution: |
  Handling host path mounting risks:
  1. Avoid mounting host paths, especially sensitive directories like /, /etc, /var
  2. Use PersistentVolume and PersistentVolumeClaim
  3. If mounting is necessary, restrict the path and set read-only mode


# Tags
tags:
  - security
  - volumes
  - hostPath
