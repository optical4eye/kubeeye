---
# OPA rule - container image tags check
id: opa_image_tags
name: Container image tags check
description: Checks if container image tags meet standards, including latest tag check and tag format validation
type: opa
category: security
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Resources configuration - specifying resource types for checking
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true

  # Rego rule configuration - inline definition
  rego:
    inline: |
      package kubernetes

      # Get Pod specification
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }

      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }

      # Check containers with latest tag
      latest_image_containers(containers) = latest if {
          latest := [container |
              container := containers[_]
              image := container.image
              is_latest_tag(image)
          ]
      }

      # Determine if image uses latest tag
      is_latest_tag(image) if {
          endswith(image, ":latest")
      }

      is_latest_tag(image) if {
          not contains(image, ":")
      }

      # Define violations
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          containers := array.concat(
              default_array(spec.containers),
              default_array(spec.initContainers)
          )
          latest := latest_image_containers(containers)
          count(latest) > 0

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' contains %d container(s) with latest tag: %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  count(latest),
                  concat(", ", [sprintf("%s(%s)", [c.name, c.image]) | c := latest[_]])
              ])
          }
      }

      # Helper functions
      default_array(val) = result if {
          val != null
          result = val
      }

      default_array(val) = [] if {
          val == null
      }

# Assertions settings - simplified check
assertions:
  - name: "Latest tag usage check"
    condition: "violation_count == 0"
    severity: warning
    description: "Found {{ violation_count }} resources with images using latest tag"

# Problem resolution recommendations
solution: |
  Using latest tag can lead to unstable deployments, recommended:
  1. Specify explicit version tags for all container images, e.g. v1.2.3
  2. Avoid using latest tag in production environment
  3. Implement image versioning strategy

# Tags
tags:
  - images
  - security
  - best-practice
