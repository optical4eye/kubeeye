---
# OPA правило - проверка тегов образов контейнеров
id: opa_image_tags
name: Проверка тегов образов контейнеров
description: Проверяет, соответствуют ли теги образов контейнеров стандартам, включая проверку тега latest и валидацию формата тегов
type: opa
category: security
severity: warning
enabled: true
tier: basic

# Конфигурация правила
config:
  # Конфигурация ресурсов - указание типов ресурсов для проверки
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true

  # Конфигурация rego правила - определение inline
  rego:
    inline: |
      package kubernetes

      # Получение спецификации Pod
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }

      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }

      # Проверка контейнеров с тегом latest
      latest_image_containers(containers) = latest if {
          latest := [container |
              container := containers[_]
              image := container.image
              is_latest_tag(image)
          ]
      }

      # Определение, использует ли образ тег latest
      is_latest_tag(image) if {
          endswith(image, ":latest")
      }

      is_latest_tag(image) if {
          not contains(image, ":")
      }

      # Определение нарушений
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          containers := array.concat(
              default_array(spec.containers),
              default_array(spec.initContainers)
          )
          latest := latest_image_containers(containers)
          count(latest) > 0

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' в пространстве имен '%s' содержит %d контейнер(ов) с тегом latest: %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  count(latest),
                  concat(", ", [sprintf("%s(%s)", [c.name, c.image]) | c := latest[_]])
              ])
          }
      }

      # Вспомогательные функции
      default_array(val) = result if {
          val != null
          result = val
      }

      default_array(val) = [] if {
          val == null
      }

# Настройки утверждений - упрощённая проверка
assertions:
  - name: "Проверка использования тега latest"
    condition: "violation_count == 0"
    severity: warning
    description: "Обнаружено {{ violation_count }} ресурсов с образами, использующими тег latest"

# Рекомендации по устранению проблемы
solution: |
  Использование тега latest может привести к нестабильным развертываниям, рекомендуется:
  1. Указывать явные версии тегов для всех контейнерных образов, например v1.2.3
  2. Избегать использования тега latest в производственной среде
  3. Внедрить стратегию управления версиями образов

# Метки
tags:
  - images
  - security
  - best-practice
