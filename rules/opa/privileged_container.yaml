---
# OPA rule - privileged containers check (simplified version)
id: opa_privileged_container
name: Privileged containers security check
description: Checks for privileged containers; each rule is a separate check
type: opa
category: security
severity: critical
enabled: true
tier: basic


# Rule configuration
config:
  # Resources configuration
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true


  # Rego rule configuration
  rego:
    inline: |
      package kubernetes

      # Get Pod specification
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }

      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }

      # Search for privileged containers
      privileged_containers(containers) = privileged if {
          privileged := [container |
              container := containers[_]
              container.securityContext.privileged == true
          ]
      }

      # Define violations
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          containers := array.concat(
              default_array(spec.containers),
              default_array(spec.initContainers)
          )
          privileged := privileged_containers(containers)
          count(privileged) > 0

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' contains %d privileged containers: %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  count(privileged),
                  concat(", ", [c.name | c := privileged[_]])
              ])
          }
      }

      # Helper functions
      default_array(val) = result if {
          val != null
          result = val
      }

      default_array(val) = [] if {
          val == null
      }

  # Assertions configuration
  assertions:
    - name: "Privileged containers check"
      condition: "violation_count == 0"
      severity: critical
      description: "Found {{ violation_count }} privileged containers"


# Problem resolution recommendations
solution: |
  Privileged containers security risks:
  1. Avoid using privileged: true
  2. Apply principle of least privilege, granting only necessary permissions
  3. Use securityContext to configure specific permissions


# Tags
tags:
  - security
  - privileged
  - containers
