---
# OPA rule - host network check - simplified version
id: opa_host_network
name: Pod host network check
description: Checks if Pod is using host network, one rule - one check element
type: opa
category: security
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Resources configuration
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true

  # Rego rule configuration
  rego:
    inline: |
      package kubernetes

      # Get Pod specification
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }

      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }

      # Define violation - host network usage
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          spec.hostNetwork == true

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' is using host network", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace
              ])
          }
      }

  # Assertions configuration
  assertions:
    - name: "Host network usage check"
      condition: "violation_count == 0"
      severity: warning
      description: "Found {{ violation_count }} Pods using host network"

# Problem resolution recommendations
solution: |
  Handling host network security risks:
  1. Avoid using hostNetwork: true unless absolutely necessary
  2. Use Service and Ingress to expose services
  3. Consider using CNI plugins for network isolation

# Tags
tags:
  - security
  - network
  - hostNetwork