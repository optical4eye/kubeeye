---
# Проверка частоты перезапуска Pod
id: prom_pod_restart_rate
name: Проверка частоты перезапуска Pod
description: Проверить, является ли частота перезапуска Pod аномальной
type: prometheus
category: stability
severity: warning
enabled: true
tier: basic

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - скорость роста количества перезапусков Pod
  query: "increase(kube_pod_container_status_restarts_total[10m])"

  # Конфигурация временного диапазона
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Конфигурация утверждений
  assertions:
    - name: "Проверка частоты перезапуска Pod"
      condition: "max_value < 3"
      severity: warning
      description: "Количество перезапусков Pod: {{ max_value | round(0) }} раз/10 минут"

# Теги
tags:
  - pod
  - stability
  - restart
  - workload
