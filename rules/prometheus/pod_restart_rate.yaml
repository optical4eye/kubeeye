---
# Pod restart rate check
id: prom_pod_restart_rate
name: Pod restart rate check
description: Check if Pod restart rate is abnormal
type: prometheus
category: stability
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Prometheus query configuration - rate of increase in Pod restart count
  query: "increase(kube_pod_container_status_restarts_total[10m])"

  # Time range configuration
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Assertions configuration
  assertions:
    - name: "Pod restart rate check"
      condition: "max_value < 3"
      severity: warning
      description: "Pod restart count: {{ max_value | round(0) }} times/10 minutes"

# Tags
tags:
  - pod
  - stability
  - restart
  - workload
