---
# Проверка использования CPU кластера
id: prom_cluster_cpu_usage
name: Проверка использования CPU кластера
description: Проверить использование CPU всего кластера
type: prometheus
category: cluster
severity: warning
enabled: true
tier: cluster

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - общее использование CPU кластера
  query: "100 - (avg(irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"

  # Конфигурация временного диапазона
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Конфигурация утверждений
  assertions:
    - name: "Проверка использования CPU кластера"
      condition: "max_value < 75"
      severity: warning
      description: "Использование CPU кластера: {{ max_value | round(2) }}%"

# Теги
tags:
  - cluster
  - cpu
  - performance
