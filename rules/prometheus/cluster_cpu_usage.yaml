---
# Cluster CPU usage check
id: prom_cluster_cpu_usage
name: Cluster CPU usage check
description: Check CPU usage of the entire cluster
type: prometheus
category: cluster
severity: warning
enabled: true
tier: cluster

# Rule configuration
config:
  # Prometheus query configuration - total cluster CPU usage
  query: "100 - (avg(irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"

  # Time range configuration
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Assertions configuration
  assertions:
    - name: "Cluster CPU usage check"
      condition: "max_value < 75"
      severity: warning
      description: "Cluster CPU usage: {{ max_value | round(2) }}%"

# Tags
tags:
  - cluster
  - cpu
  - performance
