---
# Disk usage check rule
id: prom_disk_usage_warning
name: Node disk usage check
description: Check disk usage of node root partition
type: prometheus
category: storage
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Prometheus query configuration - disk usage
  query: "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"rootfs\"} * 100) / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"rootfs\"})"

  # Time range configuration
  time_range:
    start: "now-10m"  # 10 minutes ago
    end: "now"        # Current time
    step: "1m"        # 1 minute interval

  # Assertions configuration - simplified to one check
  assertions:
    - name: "Normal disk usage"
      condition: "max_value < 85"
      severity: warning
      description: "Disk usage: {{ max_value | round(2) }}%"

# Problem resolution recommendations
solution: |
  Handling high disk usage:
  1. View disk usage: df -h
  2. Clean logs: kubectl logs <pod> --previous | head
  3. Clean unused images: docker system prune -f
  4. Clean temporary files and cache
  5. Expand disk or add storage

# Tags
tags:
  - disk
  - storage
  - monitoring
