---
# Правило проверки использования диска
id: prom_disk_usage_warning
name: Проверка использования диска узла
description: Проверить использование диска корневого раздела узла
type: prometheus
category: storage
severity: warning
enabled: true
tier: basic

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - использование диска
  query: "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"rootfs\"} * 100) / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"rootfs\"})"

  # Конфигурация временного диапазона
  time_range:
    start: "now-10m"  # 10 минут назад
    end: "now"        # Текущее время
    step: "1m"        # Интервал 1 минута

  # Конфигурация утверждений - упрощено до одной проверки
  assertions:
    - name: "Нормальное использование диска"
      condition: "max_value < 85"
      severity: warning
      description: "Использование диска: {{ max_value | round(2) }}%"

# Рекомендации по решению проблем
solution: |
  Обработка высокого использования диска:
  1. Просмотр использования диска: df -h
  2. Очистка логов: kubectl logs <pod> --previous | head
  3. Очистка неиспользуемых образов: docker system prune -f
  4. Очистка временных файлов и кэша
  5. Расширение диска или добавление хранилища

# Теги
tags:
  - disk
  - storage
  - monitoring
