---
# Memory usage check rule - warning threshold
id: prom_memory_usage_warning
name: Node memory usage check
description: Check if node memory usage exceeds warning threshold
type: prometheus
category: resource
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Prometheus query configuration - memory usage percentage calculation
  query: "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100"

  # Time range configuration
  time_range:
    start: "now-10m"  # 10 minutes ago
    end: "now"        # Current time
    step: "1m"        # 1 minute interval

  # Assertions configuration - simplified to one check
  assertions:
    - name: "Normal memory usage"
      condition: "max_value < 85"
      severity: warning
      description: "Memory usage: {{ max_value | round(2) }}%"

# Problem resolution recommendations
solution: |
  Handling high memory usage:
  1. View memory consumption: kubectl top nodes && kubectl top pods --sort-by=memory
  2. Check memory leaks: kubectl describe pod <pod-name>
  3. Configure memory limits or add node memory
  4. Restart Pod with memory leak

# Tags
tags:
  - memory
  - performance
  - monitoring
