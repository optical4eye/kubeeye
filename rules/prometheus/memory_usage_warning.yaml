---
# Правило проверки использования памяти - порог предупреждения
id: prom_memory_usage_warning
name: Проверка использования памяти узла
description: Проверить, превышает ли использование памяти узла порог предупреждения
type: prometheus
category: resource
severity: warning
enabled: true
tier: basic

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - расчет процента использования памяти
  query: "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100"

  # Конфигурация временного диапазона
  time_range:
    start: "now-10m"  # 10 минут назад
    end: "now"        # Текущее время
    step: "1m"        # Интервал 1 минута

  # Конфигурация утверждений - упрощено до одной проверки
  assertions:
    - name: "Нормальное использование памяти"
      condition: "max_value < 85"
      severity: warning
      description: "Использование памяти: {{ max_value | round(2) }}%"

# Рекомендации по решению проблем
solution: |
  Обработка высокого использования памяти:
  1. Просмотр потребления памяти: kubectl top nodes && kubectl top pods --sort-by=memory
  2. Проверка утечек памяти: kubectl describe pod <pod-name>
  3. Настройка ограничений памяти или добавление памяти узла
  4. Перезапуск Pod с утечкой памяти

# Теги
tags:
  - memory
  - performance
  - monitoring
