---
# CPU usage check rule - warning threshold
id: prom_cpu_usage_warning
name: Node CPU usage check
description: Check if node CPU usage exceeds warning threshold
type: prometheus
category: resource
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Prometheus query configuration - direct CPU usage return
  query: "100 - (avg by(instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"

  # Time range configuration
  time_range:
    start: "now-10m"  # 10 minutes ago
    end: "now"        # Current time
    step: "1m"        # 1 minute interval

  # Assertions configuration - simplified to one check
  assertions:
    - name: "Normal CPU usage"
      condition: "max_value < 80"
      severity: warning
      description: "CPU usage: {{ max_value | round(2) }}%"

# Problem resolution recommendations
solution: |
  Handling high CPU usage:
  1. View processes with high CPU consumption: kubectl top nodes && kubectl top pods
  2. Check Pod resource limits: kubectl describe pod <pod-name>
  3. Optimize applications with high CPU consumption or add node resources
  4. Use HPA for automatic load scaling

# Tags
tags:
  - cpu
  - performance
  - monitoring
