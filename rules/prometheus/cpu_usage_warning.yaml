---
# Правило проверки использования CPU - порог предупреждения
id: prom_cpu_usage_warning
name: Проверка использования CPU узла
description: Проверить, превышает ли использование CPU узла порог предупреждения
type: prometheus
category: resource
severity: warning
enabled: true
tier: basic

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - прямой возврат использования CPU
  query: "100 - (avg by(instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"

  # Конфигурация временного диапазона
  time_range:
    start: "now-10m"  # 10 минут назад
    end: "now"        # Текущее время
    step: "1m"        # Интервал 1 минута

  # Конфигурация утверждений - упрощено до одной проверки
  assertions:
    - name: "Нормальное использование CPU"
      condition: "max_value < 80"
      severity: warning
      description: "Использование CPU: {{ max_value | round(2) }}%"

# Рекомендации по решению проблем
solution: |
  Обработка высокого использования CPU:
  1. Просмотр процессов с высоким потреблением CPU: kubectl top nodes && kubectl top pods
  2. Проверка ограничений ресурсов Pod: kubectl describe pod <pod-name>
  3. Оптимизация приложений с высоким потреблением CPU или добавление ресурсов узла
  4. Использование HPA для автоматического масштабирования нагрузки

# Теги
tags:
  - cpu
  - performance
  - monitoring
