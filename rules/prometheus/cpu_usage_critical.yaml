---
# CPU usage check rule - critical threshold
id: prom_cpu_usage_critical
name: Critical node CPU usage warning
description: Check if node CPU usage exceeds critical threshold
type: prometheus
category: resource
severity: critical
enabled: true
tier: basic

# Rule configuration
config:
  # Prometheus query configuration - direct CPU usage return
  query: "100 - (avg by(instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"

  # Time range configuration
  time_range:
    start: "now-10m"  # 10 minutes ago
    end: "now"        # Current time
    step: "1m"        # 1 minute interval

  # Assertions configuration - one check per rule
  assertions:
    - name: "Critical node CPU usage warning"
      condition: "max_value < 90"
      severity: critical
      description: "Node CPU usage: {{ max_value | round(2) }}%"

# Tags
tags:
  - cpu
  - performance
  - critical
