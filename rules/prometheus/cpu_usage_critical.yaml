---
# Правило проверки использования CPU - критический порог
id: prom_cpu_usage_critical
name: Критическое предупреждение об использовании CPU узла
description: Проверить, превышает ли использование CPU узла критический порог
type: prometheus
category: resource
severity: critical
enabled: true
tier: basic

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - прямой возврат использования CPU
  query: "100 - (avg by(instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"

  # Конфигурация временного диапазона
  time_range:
    start: "now-10m"  # 10 минут назад
    end: "now"        # Текущее время
    step: "1m"        # Интервал 1 минута

  # Конфигурация утверждений - одна проверка на правило
  assertions:
    - name: "Критическое предупреждение об использовании CPU узла"
      condition: "max_value < 90"
      severity: critical
      description: "Использование CPU узла: {{ max_value | round(2) }}%"

# Теги
tags:
  - cpu
  - performance
  - critical
