---
# Memory usage check rule - critical threshold
id: prom_memory_usage_critical
name: Critical node memory usage warning
description: Check if node memory usage exceeds critical threshold
type: prometheus
category: resource
severity: critical
enabled: true
tier: basic

# Rule configuration
config:
  # Prometheus query configuration - direct memory usage return
  query: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100"

  # Time range configuration
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Assertions configuration
  assertions:
    - name: "Critical node memory usage warning"
      condition: "max_value < 95"
      severity: critical
      description: "Node memory usage: {{ max_value | round(2) }}%"

# Tags
tags:
  - memory
  - performance
  - critical
