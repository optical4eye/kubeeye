---
# Правило проверки использования памяти - критический порог
id: prom_memory_usage_critical
name: Критическое предупреждение об использовании памяти узла
description: Проверить, превышает ли использование памяти узла критический порог
type: prometheus
category: resource
severity: critical
enabled: true
tier: basic

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - прямой возврат использования памяти
  query: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100"

  # Конфигурация временного диапазона
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Конфигурация утверждений
  assertions:
    - name: "Критическое предупреждение об использовании памяти узла"
      condition: "max_value < 95"
      severity: critical
      description: "Использование памяти узла: {{ max_value | round(2) }}%"

# Теги
tags:
  - memory
  - performance
  - critical
