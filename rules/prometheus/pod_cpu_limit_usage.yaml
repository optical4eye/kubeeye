---
# Pod CPU limit usage check
id: prom_pod_cpu_limit_usage
name: Pod CPU limit usage check
description: Checks if Pod CPU usage is approaching its limit
type: prometheus
category: workload
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Prometheus query configuration - Pod CPU usage relative to its limit
  query: "(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]) / on(container,pod,namespace) kube_pod_container_resource_limits{resource=\"cpu\"}) * 100"

  # Time range configuration
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Assertions configuration
  assertions:
    - name: "Pod CPU limit usage check"
      condition: "max_value < 85"
      severity: warning
      description: "Pod CPU usage: {{ max_value | round(2) }}%"

# Tags
tags:
  - pod
  - cpu
  - workload
  - limits
