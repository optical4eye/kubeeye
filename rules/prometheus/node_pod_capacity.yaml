---
# Node Pod capacity usage check
id: prom_node_pod_capacity
name: Node Pod capacity usage check
description: Check if number of Pods on node is approaching node capacity limit
type: prometheus
category: capacity
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Prometheus query configuration - node Pod usage
  query: "(sum by(node) (kube_pod_info{host_network=\"false\"}) / sum by(node) (kube_node_status_capacity{resource=\"pods\"})) * 100"

  # Time range configuration
  time_range:
    start: "now-5m"
    end: "now"
    step: "1m"

  # Assertions configuration
  assertions:
    - name: "Node Pod capacity usage check"
      condition: "max_value < 85"
      severity: warning
      description: "Node Pod capacity usage: {{ max_value | round(2) }}%"

# Tags
tags:
  - node
  - pod
  - capacity
  - workload
