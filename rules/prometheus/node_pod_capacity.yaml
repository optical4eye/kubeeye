---
# Проверка использования емкости Pod узла
id: prom_node_pod_capacity
name: Проверка использования емкости Pod узла
description: Проверить, приближается ли количество Pod на узле к ограничению емкости узла
type: prometheus
category: capacity
severity: warning
enabled: true
tier: basic

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - использование Pod узла
  query: "(sum by(node) (kube_pod_info{host_network=\"false\"}) / sum by(node) (kube_node_status_capacity{resource=\"pods\"})) * 100"

  # Конфигурация временного диапазона
  time_range:
    start: "now-5m"
    end: "now"
    step: "1m"

  # Конфигурация утверждений
  assertions:
    - name: "Проверка использования емкости Pod узла"
      condition: "max_value < 85"
      severity: warning
      description: "Использование емкости Pod узла: {{ max_value | round(2) }}%"

# Теги
tags:
  - node
  - pod
  - capacity
  - workload
