---
# Проверка использования квоты ресурсов пространства имен
id: prom_namespace_resource_quota
name: Проверка использования квоты ресурсов пространства имен
description: Проверить использование квоты ресурсов пространства имен
type: prometheus
category: quota
severity: warning
enabled: true
tier: basic

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - использование квоты CPU пространства имен
  query: "(sum by(namespace) (kube_resourcequota{resource=\"requests.cpu\", type=\"used\"}) / sum by(namespace) (kube_resourcequota{resource=\"requests.cpu\", type=\"hard\"})) * 100"

  # Конфигурация временного диапазона
  time_range:
    start: "now-5m"
    end: "now"
    step: "1m"

  # Конфигурация утверждений
  assertions:
    - name: "Проверка использования квоты ресурсов пространства имен"
      condition: "max_value < 90"
      severity: warning
      description: "Использование квоты CPU пространства имен: {{ max_value | round(2) }}%"

# Теги
tags:
  - namespace
  - quota
  - cpu
  - resource
