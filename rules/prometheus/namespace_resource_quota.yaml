---
# Namespace resource quota usage check
id: prom_namespace_resource_quota
name: Namespace resource quota usage check
description: Check namespace resource quota usage
type: prometheus
category: quota
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Prometheus query configuration - namespace CPU quota usage
  query: "(sum by(namespace) (kube_resourcequota{resource=\"requests.cpu\", type=\"used\"}) / sum by(namespace) (kube_resourcequota{resource=\"requests.cpu\", type=\"hard\"})) * 100"

  # Time range configuration
  time_range:
    start: "now-5m"
    end: "now"
    step: "1m"

  # Assertions configuration
  assertions:
    - name: "Namespace resource quota usage check"
      condition: "max_value < 90"
      severity: warning
      description: "Namespace CPU quota usage: {{ max_value | round(2) }}%"

# Tags
tags:
  - namespace
  - quota
  - cpu
  - resource
