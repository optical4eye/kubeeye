---
# Pod memory limit usage check
id: prom_pod_memory_limit_usage
name: Pod memory limit usage check
description: Check if Pod memory usage is approaching its limit
type: prometheus
category: workload
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Prometheus query configuration - Pod memory usage relative to its limit
  query: "(container_memory_working_set_bytes{container!=\"\"} / on(container,pod,namespace) kube_pod_container_resource_limits{resource=\"memory\"}) * 100"

  # Time range configuration
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Assertions configuration
  assertions:
    - name: "Pod memory limit usage check"
      condition: "max_value < 85"
      severity: warning
      description: "Pod memory usage: {{ max_value | round(2) }}%"

# Tags
tags:
  - pod
  - memory
  - workload
  - limits
