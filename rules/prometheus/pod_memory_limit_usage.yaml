---
# Проверка использования ограничения памяти Pod
id: prom_pod_memory_limit_usage
name: Проверка использования ограничения памяти Pod
description: Проверить, приближается ли использование памяти Pod к его ограничению
type: prometheus
category: workload
severity: warning
enabled: true
tier: basic

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - использование памяти Pod относительно его ограничения
  query: "(container_memory_working_set_bytes{container!=\"\"} / on(container,pod,namespace) kube_pod_container_resource_limits{resource=\"memory\"}) * 100"

  # Конфигурация временного диапазона
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Конфигурация утверждений
  assertions:
    - name: "Проверка использования ограничения памяти Pod"
      condition: "max_value < 85"
      severity: warning
      description: "Использование памяти Pod: {{ max_value | round(2) }}%"

# Теги
tags:
  - pod
  - memory
  - workload
  - limits
