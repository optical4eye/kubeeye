---
# Cluster memory usage check
id: prom_cluster_memory_usage
name: Cluster memory usage check
description: Check memory usage of the entire cluster
type: prometheus
category: cluster
severity: warning
enabled: true
tier: cluster

# Rule configuration
config:
  # Prometheus query configuration - total cluster memory usage
  query: "(1 - (sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))) * 100"

  # Time range configuration
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Assertions configuration
  assertions:
    - name: "Normal cluster memory usage"
      condition: "max_value < 80"
      severity: warning
      description: "Cluster memory usage: {{ max_value | round(2) }}%"

# Tags
tags:
  - cluster
  - memory
  - performance
