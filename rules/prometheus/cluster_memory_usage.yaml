---
# Проверка использования памяти кластера
id: prom_cluster_memory_usage
name: Проверка использования памяти кластера
description: Проверить использование памяти всего кластера
type: prometheus
category: cluster
severity: warning
enabled: true
tier: cluster

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - общее использование памяти кластера
  query: "(1 - (sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))) * 100"

  # Конфигурация временного диапазона
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # Конфигурация утверждений
  assertions:
    - name: "Нормальное использование памяти кластера"
      condition: "max_value < 80"
      severity: warning
      description: "Использование памяти кластера: {{ max_value | round(2) }}%"

# Теги
tags:
  - cluster
  - memory
  - performance
