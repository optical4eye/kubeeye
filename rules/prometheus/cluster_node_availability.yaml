---
# Проверка доступности узлов кластера
id: prom_cluster_node_availability
name: Проверка доступности узлов кластера
description: Проверить пропорцию доступных узлов в кластере
type: prometheus
category: cluster
severity: critical
enabled: true
tier: cluster

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - пропорция доступных узлов
  query: "(sum(up{job=\"node-exporter\"}) / count(up{job=\"node-exporter\"})) * 100"

  # Конфигурация временного диапазона
  time_range:
    start: "now-5m"
    end: "now"
    step: "1m"

  # Конфигурация утверждений
  assertions:
    - name: "Проверка доступности узлов кластера"
      condition: "max_value > 80"
      severity: critical
      description: "Доступность узлов кластера: {{ max_value | round(2) }}%"

# Теги
tags:
  - cluster
  - availability
  - nodes
