---
# Cluster node availability check
id: prom_cluster_node_availability
name: Cluster node availability check
description: Check the proportion of available nodes in the cluster
type: prometheus
category: cluster
severity: critical
enabled: true
tier: cluster

# Rule configuration
config:
  # Prometheus query configuration - proportion of available nodes
  query: "(sum(up{job=\"node-exporter\"}) / count(up{job=\"node-exporter\"})) * 100"

  # Time range configuration
  time_range:
    start: "now-5m"
    end: "now"
    step: "1m"

  # Assertions configuration
  assertions:
    - name: "Cluster node availability check"
      condition: "max_value > 80"
      severity: critical
      description: "Cluster node availability: {{ max_value | round(2) }}%"

# Tags
tags:
  - cluster
  - availability
  - nodes
