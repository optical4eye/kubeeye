---
# Pod running state ratio check
id: prom_pod_running_ratio
name: Pod running state ratio check
description: Check proportion of Pods in Running state in the cluster
type: prometheus
category: workload
severity: warning
enabled: true
tier: cluster

# Rule configuration
config:
  # Prometheus query configuration - proportion of Pods in Running state
  query: "(sum(kube_pod_status_phase{phase=\"Running\"}) / sum(kube_pod_status_phase)) * 100"

  # Time range configuration
  time_range:
    start: "now-5m"
    end: "now"
    step: "1m"

  # Assertions configuration
  assertions:
    - name: "Pod running state ratio check"
      condition: "max_value < 85"
      severity: warning
      description: "Pod running state ratio too high: {{ max_value | round(2) }}%, consider adding nodes for expansion"

# Tags
tags:
  - pod
  - workload
  - availability
  - cluster
