---
# Проверка пропорции состояния выполнения Pod
id: prom_pod_running_ratio
name: Проверка пропорции состояния выполнения Pod
description: Проверить пропорцию Pod в состоянии Running в кластере
type: prometheus
category: workload
severity: warning
enabled: true
tier: cluster

# Конфигурация правила
config:
  # Конфигурация запроса Prometheus - пропорция Pod в состоянии Running
  query: "(sum(kube_pod_status_phase{phase=\"Running\"}) / sum(kube_pod_status_phase)) * 100"

  # Конфигурация временного диапазона
  time_range:
    start: "now-5m"
    end: "now"
    step: "1m"

  # Конфигурация утверждений
  assertions:
    - name: "Проверка пропорции состояния выполнения Pod"
      condition: "max_value < 85"
      severity: warning
      description: "Пропорция состояния выполнения Pod слишком высока: {{ max_value | round(2) }}%, рекомендуется рассмотреть добавление узлов для расширения"

# Теги
tags:
  - pod
  - workload
  - availability
  - cluster
