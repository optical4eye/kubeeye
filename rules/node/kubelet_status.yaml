---
# Kubelet service status check rule
id: node_kubelet_status
name: Kubelet service status check
description: Checks if the kubelet service is running normally
type: node
category: service
severity: critical
enabled: true
tier: basic


# Rule configuration
config:
  # Execution configuration - directly returns service status
  execution:
    command: "systemctl is-active kubelet 2>/dev/null || echo 'inactive'"
    timeout: 5


  # Assertions configuration - directly uses command output
  assertions:
    - name: "Kubelet service is active"
      condition: "output.strip() == 'active'"
      severity: critical
      description: "Kubelet service status: {{ output }}"


# Problem resolution recommendations
solution: |
  Handling kubelet service issues:
  1. Check service status: systemctl status kubelet
  2. View logs: journalctl -u kubelet -f
  3. Check configuration file: /etc/kubernetes/kubelet/kubelet-config.yaml
  4. Contact system administrator to restart kubelet service if necessary


# Tags
tags:
  - service
  - kubelet
  - kubernetes
