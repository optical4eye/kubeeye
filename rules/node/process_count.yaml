---
# Total process count check rule
id: node_process_count
name: Total process count check
description: Checks if the total number of processes on the node exceeds the acceptable level
type: node
category: process
severity: warning
enabled: true
tier: basic


# Rule configuration
config:
  # Execution configuration - directly returns the total number of processes
  execution:
    command: "ps aux | grep -v grep | wc -l"
    timeout: 10


  # Assertions configuration - directly uses command output
  assertions:
    - name: "Process count is normal"
      condition: "int(output) < 500"
      severity: warning
      description: "Total process count: {{ output }}"


# Problem resolution recommendations
solution: |
  Handling excessive process count:
  1. View process list: ps aux
  2. Count processes by users: ps aux | sort -k1 | uniq -c -f1
  3. Find suspicious processes: ps aux | grep <suspicious_process>
  4. Check scheduled tasks: crontab -l


# Tags
tags:
  - process
  - count
