---
# Memory usage check rule
id: node_memory_usage_simple
name: Memory usage check
description: Checks system memory usage
type: node
category: memory
severity: warning
enabled: true
tier: basic


# Rule configuration
config:
  # Execution configuration - directly returns memory usage percentage
  execution:
    command: "free | awk 'NR==2{printf \"%.0f\", $3*100/$2 }'"
    timeout: 5


  # Assertions configuration - directly uses command output
  assertions:
    - name: "Memory usage is normal"
      condition: "int(output) < 90"
      severity: warning
      description: "Memory usage: {{ output }}%"


# Problem resolution recommendations
solution: |
  Handling high memory usage:
  1. Check memory details: free -h
  2. Check processes by memory usage: ps aux --sort=-%mem | head
  3. Clear cache: echo 3 > /proc/sys/vm/drop_caches
  4. Check processes with memory leaks


# Tags
tags:
  - memory
  - usage
