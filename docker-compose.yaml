services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kubeeye
      POSTGRES_PASSWORD: kubeeye
      POSTGRES_DB: kubeeye-db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeeye -d kubeeye-db"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  openldap:
    image: osixia/openldap:1.5.0
    container_name: kubeeye-openldap
    environment:
      LDAP_ORGANISATION: "KubeEye"
      LDAP_DOMAIN: "kubeeye.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_TLS: "false"
      LDAP_TLS_VERIFY_CLIENT: "never"
      LDAP_REPLICATION: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      #- ./ldap_config:/etc/ldap/slapd.d
      - ./ldap_init/50-bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
      #- ./ldap_data:/var/lib/ldap
    restart: unless-stopped

  # LDAP initialization container - applies LDIF after OpenLDAP starts
  ldap-init:
    image: osixia/openldap:1.5.0
    container_name: kubeeye-ldap-init
    depends_on:
      - openldap
    volumes:
      - ./ldap_init.sh:/ldap_init.sh:ro
      - ./ldap_init/50-bootstrap.ldif:/ldif/50-bootstrap.ldif:ro
    environment:
      - LDAP_HOST=openldap
      - LDAP_PORT=389
      - LDAP_ADMIN_DN=cn=admin,dc=kubeeye,dc=local
      - LDAP_ADMIN_PASSWORD=admin
    entrypoint: ["/bin/bash", "/ldap_init.sh"]
    restart: "no"

  # # phpLDAPadmin - web interface for LDAP management
  # phpldapadmin:
  #   image: osixia/phpldapadmin:0.9.0
  #   container_name: kubeeye-phpldapadmin
  #   environment:
  #     PHPLDAPADMIN_LDAP_HOSTS: "openldap"
  #     PHPLDAPADMIN_HTTPS: "false"
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - openldap
  #   restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # GitOps configuration
      - KUBEEYE_GITOPS_REPO_NAME=kubeeye_rules
      - KUBEEYE_GITOPS_REPO_URL=https://github.com/optical4eye/kubeeye-rules.git
      - KUBEEYE_GITOPS_REPO_BRANCH=main
      - KUBEEYE_GITOPS_REPO_USERNAME=optical4eye
      - KUBEEYE_GITOPS_REPO_TOKEN=""
      - KUBEEYE_GITOPS_REPO_DESCRIPTION=kubeeye repo rules
      - KUBEEYE_REPORT_RETENTION_DAYS=1
      - GIT_SSL_NO_VERIFY=1

      # Database configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kubeeye
      - DB_PASS=kubeeye
      - DB_NAME=kubeeye-db

      # JWT configuration
      - KUBEEYE_JWT_SECRET_KEY=Uk5E9obf53tnXAcunvlBUKqF9d2JF12fqz2dzipHHQl
      - KUBEEYE_JWT_ALGORITHM=HS256
      - KUBEEYE_JWT_ACCESS_TOKEN_EXPIRE_HOURS=24

      # Admin user configuration (local admin for fallback)
      - KUBEEYE_ADMIN_USERNAME=admin
      - KUBEEYE_ADMIN_EMAIL=admin@kubeeye.local
      - KUBEEYE_ADMIN_PASSWORD=admin123

      # Security settings
      - KUBEEYE_MAX_FAILED_LOGIN_ATTEMPTS=5
      - KUBEEYE_ACCOUNT_LOCK_DURATION_MINUTES=30

      # Audit configuration
      - KUBEEYE_AUDIT_ENABLED=true
      - KUBEEYE_AUDIT_RETENTION_DAYS=1

      # LDAP configuration
      - KUBEEYE_LDAP_ENABLED=true
      - KUBEEYE_LDAP_SERVER_URL=ldap://openldap:389
      - KUBEEYE_LDAP_USE_SSL=false
      - KUBEEYE_LDAP_BIND_DN=cn=admin,dc=kubeeye,dc=local
      - KUBEEYE_LDAP_BIND_PASSWORD=admin
      - KUBEEYE_LDAP_BASE_DN=ou=users,dc=kubeeye,dc=local
      - KUBEEYE_LDAP_GROUP_BASE_DN=ou=groups,dc=kubeeye,dc=local
      - KUBEEYE_LDAP_ADMIN_GROUP=cn=kubeeye-admins,ou=groups,dc=kubeeye,dc=local
      - KUBEEYE_LDAP_OPERATOR_GROUP=cn=kubeeye-operators,ou=groups,dc=kubeeye,dc=local
      - KUBEEYE_LDAP_USER_FILTER=(uid={username})
      - KUBEEYE_LDAP_TYPE=openldap
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ldap-init:
        condition: service_completed_successfully
      openldap:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: kubeeye-network
