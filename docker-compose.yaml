services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kubeeye
      POSTGRES_PASSWORD: kubeeye
      POSTGRES_DB: kubeeye-db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeeye -d kubeeye-db"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  openldap:
    image: osixia/openldap:1.5.0
    container_name: kubeeye-openldap
    environment:
      LDAP_ORGANISATION: "KubeEye"
      LDAP_DOMAIN: "kubeeye.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_TLS: "false"
      LDAP_TLS_VERIFY_CLIENT: "never"
      LDAP_REPLICATION: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    ports:
      - "389:389"
      - "636:636"
    # LDAP data is initialized via ldapadd after container start (see run.sh)
    tmpfs:
      - /var/lib/ldap
      - /etc/ldap/slapd.d
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:389", "-b", "", "-s", "base", "(objectclass=*)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Dex - OpenID Connect Identity Provider
  dex:
    image: dexidp/dex:v2.45.0
    container_name: kubeeye-dex
    volumes:
      - ./ldap_files/dex-config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    restart: unless-stopped
    depends_on:
      openldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://192.168.0.15:5556/dex/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # GitOps configuration
      - KUBEEYE_GITOPS_REPO_NAME=kubeeye_rules
      - KUBEEYE_GITOPS_REPO_URL=https://github.com/optical4eye/kubeeye-rules.git
      - KUBEEYE_GITOPS_REPO_BRANCH=main
      - KUBEEYE_GITOPS_REPO_USERNAME=optical4eye
      - KUBEEYE_GITOPS_REPO_TOKEN=""
      - KUBEEYE_GITOPS_REPO_DESCRIPTION=kubeeye repo rules
      - KUBEEYE_REPORT_RETENTION_DAYS=1
      - GIT_SSL_NO_VERIFY=1

      # Database configuration
      - KUBEEYE_DB_HOST=postgres
      - KUBEEYE_DB_PORT=5432
      - KUBEEYE_DB_USER=kubeeye
      - KUBEEYE_DB_PASS=kubeeye
      - KUBEEYE_DB_NAME=kubeeye-db

      # JWT configuration
      - KUBEEYE_JWT_SECRET_KEY=Uk5E9obf53tnXAcunvlBUKqF9d2JF12fqz2dzipHHQl
      - KUBEEYE_JWT_ALGORITHM=HS256
      - KUBEEYE_JWT_ACCESS_TOKEN_EXPIRE_HOURS=24

      # Admin user configuration (local admin for fallback)
      - KUBEEYE_ADMIN_USERNAME=admin
      - KUBEEYE_ADMIN_EMAIL=admin@kubeeye.local
      - KUBEEYE_ADMIN_PASSWORD=admin123

      # OAuth/Dex configuration
      # Use host.docker.internal to access Dex from inside the container
      - KUBEEYE_OAUTH_ISSUER_URL=http://192.168.0.15:5556/dex
      - KUBEEYE_OAUTH_CLIENT_ID=kubeeye
      - KUBEEYE_OAUTH_CLIENT_SECRET=kubeeye-secret
      - KUBEEYE_OAUTH_REDIRECT_URI=http://192.168.0.15:3000/auth/callback
      - KUBEEYE_OAUTH_SCOPE=openid profile email groups

      # Group to role mapping (comma-separated list of groups)
      - KUBEEYE_OAUTH_ADMIN_GROUPS=kubeeye-admins
      - KUBEEYE_OAUTH_OPERATOR_GROUPS=kubeeye-operators
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      dex:
        condition: service_healthy
      openldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: kubeeye-network
