---
# Frontend configuration
frontend:
  replicaCount: 1
  image:
    repository: kubeeye-frontend
    tag: "v3.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    nodePort: 30693
  resources:
    limits:
      memory: "1Gi"
      cpu: "500m"
    requests:
      memory: "1Gi"
      cpu: "500m"

# Backend configuration
backend:
  replicaCount: 1
  image:
    repository: kubeeye-backend
    tag: "v3.0"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  env:
    - name: KUBEEYE_GITOPS_REPO_NAME
      value: "kubeeye_rules"
    - name: KUBEEYE_GITOPS_REPO_URL
      value: "https://github.com/optical4eye/kubeeye-rules.git"
    - name: KUBEEYE_GITOPS_REPO_BRANCH
      value: "main"
    - name: KUBEEYE_GITOPS_REPO_USERNAME
      value: "optical4eye"
    - name: KUBEEYE_GITOPS_REPO_TOKEN
      value: ""
    - name: KUBEEYE_GITOPS_REPO_INSECURE
      value: "false"
    - name: KUBEEYE_GITOPS_REPO_DESCRIPTION
      value: "kubeeye repo rules"
    - name: KUBEYE_REPORT_RETENTION_DAYS
      value: '1'

  resources:
    limits:
      memory: "2Gi"
      cpu: "1000m"
    requests:
      memory: "2Gi"
      cpu: "1000m"

  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

  LocalRules:
    - name: opa-host-network
      type: opa
    - name: node-disk-usage-simple
      type: node
