---
# ExternalSecret
externalSecret:
  enabled: false
  clusterSecretStoreName: ""
  secrets:
  - secretName: "gitUser"
    vaultPath: "git/creds"
    vaultKey: "username"
  - secretName: "gitToken"
    vaultPath: "git/creds"
    vaultKey: "token"
  - secretName: "kubeeye-postgres-secret"
    vaultPath: "database/postgres"
    vaultKey: "password"
  - secretName: "oauth-token"
    vaultPath: "oauth/token"
    vaultKey: "token"

# Frontend configuration
frontend:
  replicaCount: 1
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
        type: RuntimeDefault
  image:
    repository: kubeeye-frontend
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    limits:
      memory: "1Gi"
      cpu: "500m"
    requests:
      memory: "1Gi"
      cpu: "500m"

# Backend configuration
backend:
  replicaCount: 1
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
        type: RuntimeDefault
  image:
    repository: kubeeye-backend
    pullPolicy: IfNotPresent
  service:
    port: 8000
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    - name: KUBEEYE_GITOPS_REPO_NAME
      value: "kubeeye_rules"
    - name: KUBEEYE_GITOPS_REPO_URL
      value: "https://github.com/optical4eye/kubeeye-rules.git"
    - name: KUBEEYE_GITOPS_REPO_BRANCH
      value: "main"
    - name: KUBEEYE_GITOPS_REPO_USERNAME
      value: "optical4eye"
    - name: KUBEEYE_GITOPS_REPO_DESCRIPTION
      value: "kubeeye repo rules"
    - name: KUBEEYE_DB_USER
      value: "kubeeye"
    - name: KUBEEYE_DB_NAME
      value: "kubeeye"
    - name: KUBEEYE_DB_PASS
      value: "password"
    - name: KUBEEYE_ADMIN_USERNAME
      value: "admin"
    - name: KUBEEYE_ADMIN_EMAIL
      value: "admin@kubeeye.local"
    - name: KUBEEYE_ADMIN_PASSWORD
      value: "admin123"
    - name: KUBEEYE_JWT_SECRET_KEY
      value: "Uk5E9obf53tnXAcunvlBUKqF9d2JF12fqz2dzipHHQl"
    # OAuth/Dex configuration (replaces LDAP)
    - name: KUBEEYE_OAUTH_ISSUER_URL
      value: "http://dex:5556/dex"
    - name: KUBEEYE_OAUTH_CLIENT_ID
      value: "kubeeye"
    - name: KUBEEYE_OAUTH_CLIENT_SECRET
      value: "kubeeye-secret"
    - name: KUBEEYE_OAUTH_REDIRECT_URI
      value: "http://localhost:3000/auth/callback"
    - name: KUBEEYE_OAUTH_SCOPE
      value: "openid profile email groups"
    # Multiple groups support (comma-separated list)
    - name: KUBEEYE_OAUTH_ADMIN_GROUPS
      value: "kubeeye-admins"
    - name: KUBEEYE_OAUTH_OPERATOR_GROUPS
      value: "kubeeye-operators"
  resources:
    limits:
      memory: "2Gi"
      cpu: "1000m"
    requests:
      memory: "2Gi"
      cpu: "1000m"

  persistence:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: postgres
    tag: 18-alpine
  auth:
    # existingSecret: ""
    # secretKeys:
    #   userPasswordKey: "user-password"
    username: "kubeeye"
    password: "password"
    database: "kubeeye"
  architecture: standalone
  primary:
    persistence:
      enabled: true
      size: 8Gi
    containerSecurityContext:
      readOnlyRootFilesystem: false
    nodeSelector: {}
    tolerations: []
    affinity: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: kubeeye.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: kubeeye-tls
  #    hosts:
  #      - kubeeye.local
