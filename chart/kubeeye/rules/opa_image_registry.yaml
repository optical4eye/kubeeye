---
# OPA rule - allowed registry check and Docker Hub prohibition
id: opa-image-registry
name: Container image allowed registry check
description: Requires use of only allowed registries (ww.com or ss.com) and prohibits Docker Hub usage.
type: opa
category: security
severity: warning
enabled: true
tier: basic

# Rule configuration
config:
  # Resources configuration
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true

  # Rego rule configuration
  rego:
    inline: |
      package kubernetes

      # Allowed registries
      allowed_registries = {"ww.com", "ss.com"}

      # Forbidden registries
      forbidden_registries = {"docker.io", "registry.hub.docker.com", "index.docker.io"}

      # Get Pod specification
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }

      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }

      # Extract registry from image name
      extract_registry(image) = registry if {
          contains(image, "/")
          parts := split(image, "/")
          registry := parts[0]
      }

      extract_registry(image) = "docker.io" if {
          not contains(image, "/")
      }

      # Check if image uses allowed registry
      uses_allowed_registry(image) if {
          registry := extract_registry(image)
          allowed_registries[registry]
      }

      # Check if image uses forbidden registry
      uses_forbidden_registry(image) if {
          registry := extract_registry(image)
          forbidden_registries[registry]
      }

      # Violation definition - using forbidden registry
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          container := spec.containers[_]
          not uses_allowed_registry(container.image)

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' uses unauthorized registry for image %s. Only allowed: ww.com, ss.com", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  container.image
              ])
          }
      }

      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          container := spec.initContainers[_]
          not uses_allowed_registry(container.image)

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' uses unauthorized registry for image %s (init container). Only allowed: ww.com, ss.com", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  container.image
              ])
          }
      }

      # Special violation for Docker Hub
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          container := spec.containers[_]
          uses_forbidden_registry(container.image)

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' uses forbidden Docker Hub for image %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  container.image
              ])
          }
      }

      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          container := spec.initContainers[_]
          uses_forbidden_registry(container.image)

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' uses forbidden Docker Hub for image %s (init container)", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  container.image
              ])
          }
      }

  # Assertions configuration
  assertions:
    - name: "Allowed registry check"
      condition: "violation_count == 0"
      severity: warning
      description: "Found {{ violation_count }} resources using unauthorized registries"

# Problem resolution recommendations
solution: |
  Use of unauthorized registries is prohibited by security policy.
  1. Use only allowed registries: ww.com or ss.com
  2. Docker Hub and other public registries are prohibited
  3. Examples of correct image formats:
      - ww.com/nginx:1.25
      - ss.com/myapp:v2.1.0
      - ww.com/library/postgres:15
  4. Examples of prohibited formats:
      - nginx:latest (Docker Hub)
      - docker.io/nginx:1.25
      - registry.hub.docker.com/library/redis:7
      - gcr.io/myproject/app:v1
  5. Rebuild images and upload them to allowed registries

# Tags
tags:
  - security
  - compliance
  - registry
  - images
  - docker-hub