---
# Правило проверки использования диска
id: node-disk-usage-simple
name: Проверка использования диска
description: Проверяет использование диска на корневом разделе
type: node
category: storage
severity: warning
enabled: true
tier: basic


# Конфигурация правила
config:
  # Конфигурация выполнения - напрямую возвращает процент использования
  execution:
    command: "df -h / | tail -1 | awk '{print $5}' | sed 's/%//'"
    timeout: 5


  # Конфигурация утверждений - напрямую использует вывод команды
  assertions:
    - name: "Использование диска в норме"
      condition: "int(output) < 70"
      severity: warning
      description: "Использование корневого раздела: {{ output }}%"


# Рекомендации по устранению проблемы
solution: |
  Обработка высокого использования диска:
  1. Проверить использование диска: df -h
  2. Найти крупные файлы: find / -type f -size +100M 2>/dev/null
  3. Проверить использование журналов: journalctl --disk-usage
  4. Обратиться к администратору для очистки временных файлов и журналов (если нужно)


# Метки
tags:
  - storage
  - disk
  - usage
