---
# OPA rule - container resource limits check - using assertions format
id: opa-resource-limits
name: Container resource limits check
description: Checks that all containers have resource requests and limits set to prevent resource competition and node overload
type: opa
category: resource
severity: warning
enabled: true
tier: basic


# Rule configuration
config:
  # Resources configuration
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true


  # Scope configuration
  scope:
    namespaces:
      include: []  # empty list means all non-excluded namespaces
      exclude:
        - kube-system
        - kube-public

  # Inline rego rule configuration
  rego:
    inline: |
      package kubernetes

      # Get Pod specification
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }

      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }

      # Definition of containers without specified resource field (requests or limits)
      missing_resources_containers(containers, field) = missing if {
          missing := [container |
              container := containers[_]
              resources := object.get(container, "resources", {})
              not resources[field]
          ]
      }

      # Violation definition - missing resource requests
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          containers := array.concat(
              default_array(spec.containers),
              default_array(spec.initContainers)
          )
          missing_requests := missing_resources_containers(containers, "requests")
          count(missing_requests) > 0

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' contains %d container(s) without resource requests: %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  count(missing_requests),
                  concat(", ", [c.name | c := missing_requests[_]])
              ])
          }
      }

      # Violation definition - missing resource limits
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          containers := array.concat(
              default_array(spec.containers),
              default_array(spec.initContainers)
          )
          missing_limits := missing_resources_containers(containers, "limits")
          count(missing_limits) > 0

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' contains %d container(s) without resource limits: %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  count(missing_limits),
                  concat(", ", [c.name | c := missing_limits[_]])
              ])
          }
      }

      # Helper functions - return empty array if value is null
      default_array(val) = result if {
          val != null
          result = val
      }

      default_array(val) = [] if {
          val == null
      }

  # Assertions configuration
  assertions:
    - name: "Check for missing resources in containers"
      condition: "violation_count == 0"
      severity: warning
      description: "Found {{ violation_count }} resources without properly configured requests and/or resource limits"

    - name: "Check for significant number of containers without resources"
      condition: "violation_count < 10"
      severity: critical
      description: "Found large number of {{ violation_count }} resources without properly configured requests and/or resource limits"


# Problem resolution recommendations
solution: |
  Set resource requests and limits for all containers to avoid resource competition and node overload:

  1. Set reasonable resource request values for each container:
    ```
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
    ```

  2. Set adequate resource limit values for each container:
    ```
    resources:
      limits:
        memory: "256Mi"
        cpu: "500m"
    ```

  3. Monitor actual resource consumption by applications and adjust request and limit values accordingly
  4. Use LimitRange or ResourceQuota to manage resource allocation in namespaces
  5. For different environments (development, testing, production) set different resource configurations


# Tags
tags:
  - resources
  - best-practice
  - performance
  - stability
