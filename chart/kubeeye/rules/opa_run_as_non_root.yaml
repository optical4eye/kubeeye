---
# OPA rule - check for running containers not as root user (simplified version)
id: opa-run-as-non_root
name: Check for running containers not as root user
description: Checks that containers are not run as root user; each rule is a separate check
type: opa
category: security
severity: warning
enabled: true
tier: basic


# Rule configuration
config:
  # Resources configuration
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true

  # Rego rule configuration
  rego:
    inline: |
      package kubernetes

      # Get Pod specification
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }

      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }

      # Search for containers without explicit non-root run
      non_root_violations(containers, pod_security_context) = violations if {
          violations := [container |
              container := containers[_]
              # No runAsNonRoot setting in container and Pod
              not container.securityContext.runAsNonRoot
              not pod_security_context.runAsNonRoot
          ]
      }

      # Violation definition
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          containers := array.concat(
              default_array(spec.containers),
              default_array(spec.initContainers)
          )
          pod_security_context := default_object(spec.securityContext)
          violations := non_root_violations(containers, pod_security_context)
          count(violations) > 0

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' contains %d container(s) not explicitly run as non-root: %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  count(violations),
                  concat(", ", [c.name | c := violations[_]])
              ])
          }
      }

      # Helper functions
      default_array(val) = result if {
          val != null
          result = val
      }

      default_array(val) = [] if {
          val == null
      }

      default_object(val) = result if {
          val != null
          result = val
      }

      default_object(val) = {} if {
          val == null
      }

  # Assertions configuration
  assertions:
    - name: "Check for running containers not as root"
      condition: "violation_count == 0"
      severity: warning
      description: "Found {{ violation_count }} containers without explicit non-root user run"


# Problem resolution recommendations
solution: |
  Container user security configuration:
  1. Set runAsNonRoot: true in securityContext
  2. Specify runAsUser with ID not equal to 0
  3. Create a dedicated user in the container image with minimal privileges


# Tags
tags:
  - security
  - runAsNonRoot
  - user
