---
# Zombie processes check rule
id: node-zombie-processes
name: Zombie processes check
description: Checks for zombie processes on the node
type: node
category: process
severity: warning
enabled: true
tier: basic


# Rule configuration
config:
  # Execution configuration - directly returns count
  execution:
    command: "ps aux | awk '$8 ~ /^Z/ { count++ } END { print count+0 }'"
    timeout: 10


  # Assertions configuration - directly uses command output
  assertions:
    - name: "No zombie processes"
      condition: "output == '0'"
      severity: warning
      description: "Found {{ output }} zombie processes"


# Problem resolution recommendations
solution: |
  Handling zombie processes:
  1. View zombie processes: ps aux | awk '$8 ~ /^Z/'
  2. Find parent process and restart
  3. Reboot system if necessary


# Tags
tags:
  - process
  - zombie
