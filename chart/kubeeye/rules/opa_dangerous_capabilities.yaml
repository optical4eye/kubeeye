---
# OPA rule - dangerous Linux capabilities check
id: opa-dangerous-capabilities
name: Linux container dangerous capabilities check
description: Checks if dangerous Linux capabilities are configured in the container, such as CAP_SYS_ADMIN, which may pose a security risk
type: opa
category: security
severity: high
enabled: true
tier: standard


# Rule configuration
config:
  # Resources configuration
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true


  # Scope configuration
  scope:
    namespaces:
      include: []  # all namespaces
      exclude:
        - kube-system
        - kube-public


  # Rego rule configuration
  rego:
    inline: |
      package kubernetes

      # Get Pod specification
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }

      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }

      # List of dangerous Linux capabilities
      dangerous_caps := {
          "SYS_ADMIN",
          "SYS_TIME",
          "SYS_MODULE",
          "NET_ADMIN",
          "NET_RAW",
          "SYS_PTRACE",
          "DAC_OVERRIDE",
          "SETUID",
          "SETGID"
      }

      # Check dangerous capabilities in containers
      dangerous_capabilities(containers) = dangerous if {
          dangerous := [container |
              container := containers[_]
              security_context := default_object(container.securityContext)
              capabilities := default_object(security_context.capabilities)
              add_caps := default_array(capabilities.add)
              container_dangerous_caps := [cap |
                  cap := add_caps[_]
                  dangerous_caps[upper(cap)]
              ]
              count(container_dangerous_caps) > 0
          ]
      }

      # Violation rule - dangerous capabilities
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          containers := array.concat(
              default_array(spec.containers),
              default_array(spec.initContainers)
          )
          dangerous := dangerous_capabilities(containers)
          count(dangerous) > 0

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' contains %d container(s) with dangerous capabilities: %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  count(dangerous),
                  concat(", ", [c.name | c := dangerous[_]])
              ])
          }
      }

      # Helper functions
      default_array(val) = result if {
          val != null
          result = val
      }

      default_array(val) = [] if {
          val == null
      }

      default_object(val) = result if {
          val != null
          result = val
      }

      default_object(val) = {} if {
          val == null
      }


# Assertions configuration
assertions:
  - name: "Dangerous capabilities check"
    condition: "violation_count == 0"
    severity: high
    description: "Found {{ violation_count }} containers with dangerous capabilities"


# Problem resolution recommendations
solution: |

  Remove unnecessary Linux capabilities, applying the principle of least privilege:
  ```yaml
  securityContext:
    capabilities:
      drop: ["ALL"]  # First drop all capabilities
      add: []        # Add only absolutely necessary capabilities
  ```

# Tags
tags:
  - security
  - linux-capabilities
  - container-security