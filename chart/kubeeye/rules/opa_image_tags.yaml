---
# OPA rule - check for using latest tag for container images
id: opa-image-tags
name: Check for using latest tag for container images
description: Prohibits using the latest tag for container images in pods and related resources.
type: opa
category: security
severity: warning
enabled: true
tier: basic


# Rule configuration
config:
  # Resources configuration
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true


  # Rego rule configuration
  rego:
    inline: |
      package kubernetes

      # Get Pod specification
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }

      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }

      # Helper function to check if string ends with "latest"
      is_latest(image) if {
          endswith(image, ":latest")
      }

      # Violation definition - using latest tag
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          # Check both regular containers and init containers
          container := spec.containers[_]
          is_latest(container.image)

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' uses forbidden latest tag for image %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  container.image
              ])
          }
      }

      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          # Check init containers
          container := spec.initContainers[_]
          is_latest(container.image)

          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' uses forbidden latest tag for image %s (init container)", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  container.image
              ])
          }
      }

  # Assertions configuration
  assertions:
    - name: "Check for absence of latest tag"
      condition: "violation_count == 0"
      severity: warning
      description: "Found {{ violation_count }} Pods using latest tag"


# Problem resolution recommendations
solution: |
  Avoid using latest tag in production environment.
  1. Use explicit, immutable version tags (e.g., 1.2.3 or SHA hashes).
  2. Latest tag may point to different code at different times, leading to unpredictable behavior and deployment reproducibility issues.


# Tags
tags:
  - security
  - best-practices
  - images
  - latest