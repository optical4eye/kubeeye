---
# CPU load check rule
id: node-load-average-simple
name: CPU load check
description: Checks system average load over 1 minute
type: node
category: cpu
severity: warning
enabled: true
tier: basic


# Rule configuration
config:
  # Execution configuration - directly returns load value
  execution:
    command: "uptime | awk -F'load average:' '{ print $2 }' | awk -F, '{ print $1 }' | xargs"
    timeout: 5


  # Assertions configuration - directly uses command output
  assertions:
    - name: "System load is normal"
      condition: "float(output) < 4.0"
      severity: warning
      description: "Average load over 1 minute: {{ output }}"


# Problem resolution recommendations
solution: |
  Handling high system load:
  1. View load details: uptime
  2. Check CPU usage: top -c
  3. Check IO wait: iostat -x 1 5
  4. Find processes with high CPU load: ps aux --sort=-%cpu | head


# Tags
tags:
  - cpu
  - load
  - performance
