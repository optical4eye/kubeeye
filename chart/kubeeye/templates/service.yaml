---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeeye.fullname" . }}-frontend
  labels:
    {{- include "kubeeye.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: kubeeye
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "kubeeye.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeeye.fullname" . }}-backend
  labels:
    {{- include "kubeeye.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kubeeye
spec:
  type: ClusterIP
  selector:
    {{- include "kubeeye.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
