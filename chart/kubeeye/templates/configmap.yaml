{{- $files := .Files }}
{{- range $path, $bytes := $files.Glob "rules/*.yaml" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ base $path | trimSuffix ".yaml" | replace "_" "-" | kebabcase }}
data:
  {{ base $path | replace "_" "-" }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeeye.fullname" . }}-nginx-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        # Logging
        access_log syslog:server=unix:/dev/log,facility=local6,tag=nginx,severity=info;
        error_log syslog:server=unix:/dev/log,facility=local6,tag=nginx,severity=error;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        server {
            listen 80;
            server_name localhost;

            root /usr/share/nginx/html;
            index index.html;

            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;

            # API proxy to backend (must be first)
            location /api {
                proxy_pass http://{{ include "kubeeye.fullname" . }}-backend:{{ .Values.backend.service.port }};
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                # Increase buffer sizes for large API responses
                proxy_buffer_size 128k;
                proxy_buffers 4 256k;
                proxy_busy_buffers_size 256k;
                proxy_temp_file_write_size 256k;
            }

            # Docs proxy to backend
            location /docs {
                proxy_pass http://{{ include "kubeeye.fullname" . }}-backend:{{ .Values.backend.service.port }}/docs;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # OpenAPI JSON proxy
            location /openapi.json {
                proxy_pass http://{{ include "kubeeye.fullname" . }}-backend:{{ .Values.backend.service.port }}/openapi.json;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Cache static assets (must be before location /)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                try_files $uri =404;
            }

            # Handle React Router (must be last)
            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }