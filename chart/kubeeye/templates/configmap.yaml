{{- $files := .Files }}
{{- range $path, $bytes := $files.Glob "rules/*.yaml" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ base $path | trimSuffix ".yaml" | replace "_" "-" | kebabcase }}
data:
  {{ base $path | replace "_" "-" }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeeye.fullname" . }}-nginx-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        # Gzip compression - только pre-compressed файлы
        gzip_static on;  # Отдача pre-compressed .gz файлов
        gzip_vary on;

        server {
            listen 3000;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;

            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;

            # WebSocket proxy to backend
            location /ws {
                proxy_pass http://{{ include "kubeeye.fullname" . }}-backend:{{ .Values.backend.service.port }};
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                # Disable buffering for WebSocket
                proxy_buffering off;
                proxy_request_buffering off;
                # Timeouts for long-lived WebSocket connections
                proxy_connect_timeout 7s;
                proxy_send_timeout 86400s;
                proxy_read_timeout 86400s;
                # Intercept backend errors
                proxy_intercept_errors on;
                error_page 502 503 504 = @backend_unavailable;
            }

            # API proxy to backend (must be first)
            location /api {
                proxy_pass http://{{ include "kubeeye.fullname" . }}-backend:{{ .Values.backend.service.port }};
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                # Increase buffer sizes for large API responses
                proxy_buffer_size 128k;
                proxy_buffers 4 256k;
                proxy_busy_buffers_size 256k;
                proxy_temp_file_write_size 256k;
                # Intercept backend errors
                proxy_intercept_errors on;
                error_page 502 503 504 = @backend_unavailable;
            }

            # Backend unavailable error handler
            location @backend_unavailable {
                default_type application/json;
                return 503 '{"error": "Backend is unavailable"}';
            }

            # Docs proxy to backend
            location /docs {
                proxy_pass http://{{ include "kubeeye.fullname" . }}-backend:{{ .Values.backend.service.port }}/docs;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # ReDoc proxy to backend
            location /redoc {
                proxy_pass http://{{ include "kubeeye.fullname" . }}-backend:{{ .Values.backend.service.port }}/redoc;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # OpenAPI JSON proxy
            location /openapi.json {
                proxy_pass http://{{ include "kubeeye.fullname" . }}-backend:{{ .Values.backend.service.port }}/openapi.json;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Cache static assets (must be before location /)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                try_files $uri =404;
            }

            # Handle React Router (must be last)
            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }